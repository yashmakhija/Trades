openapi: 3.0.0
info:
  title: 100x Trading Platform API
  description: |
    API documentation for the 100x Trading Platform, providing real-time market data and trading capabilities.

    This API allows you to:
    - Access real-time market data
    - Manage user accounts and authentication
    - Place and manage trading orders
    - Track portfolio and balance
    - Connect via WebSocket for live updates
  version: 1.0.0
  contact:
    name: API Support
    email: support@100xtrading.com

servers:
  - url: http://localhost:3001
    description: Development server
  - url: https://api.100xtrading.com
    description: Production server (Coming soon)

tags:
  - name: Authentication
    description: User registration, login, and profile management
  - name: Symbols
    description: Market symbols and price information
  - name: Orders
    description: Order placement, cancellation, and management
  - name: Portfolio
    description: User portfolio and balance information
  - name: Candles
    description: Historical and real-time candle data
  - name: WebSocket
    description: Real-time data streaming
  - name: Analytics
    description: Trade analytics and statistics
  - name: Balance
    description: Balance management

paths:
  #
  # Authentication Endpoints
  #
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account with email and password
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: SecurePassword123
                name:
                  type: string
                  example: John Doe
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: Invalid input or email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate a user and get a JWT token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: SecurePassword123
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/verify:
    get:
      tags:
        - Authentication
      summary: Verify authentication token
      description: Verify if the provided JWT token is valid and the user exists
      operationId: verifyToken
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: "123e4567-e89b-12d3-a456-426614174000"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Invalid token"

  /api/auth/profile:
    get:
      tags:
        - Authentication
      summary: Get user profile
      description: Retrieve the authenticated user's profile information
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized - Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #
  # Symbol Endpoints
  #
  /api/symbols:
    get:
      tags:
        - Symbols
      summary: Get all trading symbols
      description: Returns a list of all available trading symbols with their current prices
      operationId: getAllSymbols
      responses:
        "200":
          description: A list of symbols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Symbol"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/symbols/prices:
    get:
      tags:
        - Symbols
      summary: Get latest prices for all symbols
      description: Returns the latest real-time prices for all trading symbols
      operationId: getLatestPrices
      responses:
        "200":
          description: Latest prices for all symbols
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/TickerData"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/symbols/{name}:
    get:
      tags:
        - Symbols
      summary: Get a specific symbol by name
      description: Returns detailed information about a specific trading symbol
      operationId: getSymbolByName
      parameters:
        - name: name
          in: path
          required: true
          description: Symbol name (e.g., btcusdt)
          schema:
            type: string
      responses:
        "200":
          description: Symbol details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolDetail"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #
  # Order Endpoints
  #
  /api/orders:
    post:
      tags:
        - Orders
      summary: Place a new order
      description: |
        Place a new trading order with optional stop-loss and take-profit levels.
        Supports market and limit orders for both long and short positions.
      operationId: placeOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags:
        - Orders
      summary: Get user orders
      description: Retrieve all orders for the authenticated user
      operationId: getUserOrders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter orders by status
          schema:
            type: string
            enum: [OPEN, CLOSED, CANCELLED]
        - name: symbol
          in: query
          required: false
          description: Filter orders by symbol
          schema:
            type: string
      responses:
        "200":
          description: List of user orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized - Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/orders/{orderId}:
    delete:
      tags:
        - Orders
      summary: Cancel an order
      description: Cancel an existing open order
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: Order ID to cancel
          schema:
            type: string
      responses:
        "200":
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Order cancelled successfully
                  orderId:
                    type: string
        "401":
          description: Unauthorized - Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/orders/portfolio:
    get:
      tags:
        - Portfolio
      summary: Get user portfolio
      description: Retrieve the authenticated user's portfolio including balances and positions
      operationId: getUserPortfolio
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User portfolio retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "401":
          description: Unauthorized - Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #
  # Health Check
  #
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API
      operationId: healthCheck
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  #
  # Candle Endpoints
  #
  /api/candles:
    get:
      tags:
        - Candles
      summary: Get historical candle data
      description: Returns historical candle data for a specific symbol and timeframe
      operationId: getCandles
      parameters:
        - name: symbol
          in: query
          required: true
          description: Symbol name (e.g., btcusdt)
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          description: Candle timeframe (1m, 5m, 15m, 1h, etc.)
          schema:
            type: string
            default: "1m"
            enum: ["1m", "5m", "10m", "15m", "30m", "1h", "4h", "1d"]
        - name: limit
          in: query
          required: false
          description: Maximum number of candles to return (max 1000)
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: startTime
          in: query
          required: false
          description: Start time for historical data (ISO 8601 format)
          schema:
            type: string
            format: date-time
            example: "2024-03-01T00:00:00Z"
        - name: endTime
          in: query
          required: false
          description: End time for historical data (ISO 8601 format)
          schema:
            type: string
            format: date-time
            example: "2024-03-26T00:00:00Z"
      responses:
        "200":
          description: Historical candle data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candle"
        "400":
          description: Invalid input parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Candles
      summary: Store a new candle
      description: Store a new OHLCV candle for a specific symbol
      operationId: storeCandle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - symbol
                - open
                - high
                - low
                - close
                - volume
              properties:
                symbol:
                  type: string
                  example: "btcusdt"
                open:
                  type: integer
                  example: 45000
                high:
                  type: integer
                  example: 45500
                low:
                  type: integer
                  example: 44800
                close:
                  type: integer
                  example: 45200
                volume:
                  type: integer
                  example: 1000
                timeframe:
                  type: string
                  default: "1m"
                  enum: ["1m", "5m", "10m", "15m", "30m", "1h", "4h", "1d"]
      responses:
        "201":
          description: Candle stored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OHLCV"
        "400":
          description: Invalid input parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/candles/aggregate:
    get:
      tags:
        - Candles
      summary: Aggregate candles to a larger timeframe
      description: Aggregates candles from a source timeframe to a target timeframe
      operationId: aggregateCandles
      parameters:
        - name: symbol
          in: query
          required: true
          description: Symbol name (e.g., btcusdt)
          schema:
            type: string
        - name: sourceTimeframe
          in: query
          required: false
          description: Source candle timeframe
          schema:
            type: string
            default: "1m"
            enum: ["1m", "5m", "10m", "15m", "30m", "1h", "4h", "1d"]
        - name: targetTimeframe
          in: query
          required: true
          description: Target candle timeframe
          schema:
            type: string
            enum: ["5m", "10m", "15m", "30m", "1h", "4h", "1d"]
        - name: limit
          in: query
          required: false
          description: Maximum number of candles to return (max 100)
          schema:
            type: integer
            default: 100
            maximum: 100
      responses:
        "200":
          description: Aggregated candle data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candle"
        "400":
          description: Invalid input parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/candles/latest:
    get:
      tags:
        - Candles
      summary: Get the latest candle
      description: Returns the latest candle for a specific symbol and timeframe
      operationId: getLatestCandle
      parameters:
        - name: symbol
          in: query
          required: true
          description: Symbol name (e.g., btcusdt)
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          description: Candle timeframe
          schema:
            type: string
            default: "1m"
            enum: ["1m", "5m", "10m", "15m", "30m", "1h", "4h", "1d"]
      responses:
        "200":
          description: Latest candle data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candle"
        "400":
          description: Invalid input parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Symbol or candle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #
  # Trade Analytics Endpoints
  #
  /api/analytics/trade-history:
    get:
      tags:
        - Analytics
      summary: Get user's trade history
      description: Returns paginated trade history with filters
      operationId: getTradeHistory
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            default: 50
        - name: symbolId
          in: query
          description: Filter by symbol ID
          schema:
            type: string
        - name: startDate
          in: query
          description: Filter by start date
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter by end date
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Trade history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trade"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  /api/analytics/user-stats:
    get:
      tags:
        - Analytics
      summary: Get user's trading statistics
      description: Returns overall trading statistics for the user
      operationId: getUserStats
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          description: Filter by start date
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter by end date
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: User stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeStats"

  /api/analytics/symbol-stats:
    get:
      tags:
        - Analytics
      summary: Get trading statistics per symbol
      description: Returns trading statistics grouped by symbol
      operationId: getSymbolStats
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          description: Filter by start date
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter by end date
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Symbol stats retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SymbolStats"

  /api/analytics/daily-pnl:
    get:
      tags:
        - Analytics
      summary: Get daily PnL data
      description: Returns daily profit/loss data for a date range
      operationId: getDailyPnL
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: true
          description: Start date
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: true
          description: End date
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Daily PnL data retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                    pnl:
                      type: number
                      format: double

  #
  # Balance Endpoints
  #
  /api/balance:
    get:
      tags:
        - Balance
      summary: Get user balance
      description: Get the current USDC balance and reserved amounts for the authenticated user
      operationId: getUserBalance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Balance retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "401":
          description: Unauthorized - Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/balance/history:
    get:
      tags:
        - Balance
      summary: Get balance history
      description: Get paginated balance history with filters
      operationId: getBalanceHistory
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            default: 50
        - name: startDate
          in: query
          description: Filter by start date
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter by end date
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Balance history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/BalanceHistory"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized - Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/balance/reserved:
    get:
      tags:
        - Balance
      summary: Get reserved balance details
      description: Get details of USDC balance reserved for open orders
      operationId: getReservedBalance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reserved balance details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalReserved:
                    type: number
                    format: double
                    description: Total amount reserved for open orders
                  reservations:
                    type: array
                    items:
                      $ref: "#/components/schemas/BalanceReservation"
        "401":
          description: Unauthorized - Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          format: email
          example: "user@example.com"
        name:
          type: string
          example: "John Doe"
        usdcBalance:
          type: number
          format: float
          example: 10000.00
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Symbol:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "btcusdt"
        description:
          type: string
          example: "Bitcoin / USDT"
        currentPrice:
          type: number
          format: float
          example: 65432.10
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SymbolDetail:
      type: object
      allOf:
        - $ref: "#/components/schemas/Symbol"
        - type: object
          properties:
            latestData:
              $ref: "#/components/schemas/TickerData"

    TickerData:
      type: object
      properties:
        symbol:
          type: string
          example: "btcusdt"
        price:
          type: number
          format: float
          example: 65432.10
        priceChangePercent:
          type: number
          format: float
          example: 2.5
        volume:
          type: number
          format: float
          example: 1234.56
        timestamp:
          type: integer
          format: int64
