# WebSocket Documentation
x-websocket:
  url: ws://localhost:3001
  description: |
    The WebSocket server provides real-time updates for market data, order status changes, and portfolio updates.

    ## Connection
    Connect to the WebSocket server at `ws://localhost:3001`

    ## Authentication
    After connecting, send an authentication message with your JWT token:
    ```json
    {
      "type": "AUTH",
      "token": "your-jwt-token"
    }
    ```

    ## Subscribing to Symbols
    Subscribe to updates for specific symbols:
    ```json
    {
      "type": "SUBSCRIBE",
      "symbols": ["btcusdt", "ethusdt"]
    }
    ```

    ## Message Types
    The server will send the following message types:

    ### TICKER_UPDATE
    Real-time price updates for subscribed symbols
    ```json
    {
      "type": "TICKER_UPDATE",
      "symbol": "btcusdt",
      "data": {
        "price": 65432.10,
        "priceChangePercent": 2.5,
        "volume": 1234.56,
        "timestamp": 1647352800000
      }
    }
    ```

    ### OHLCV_UPDATE
    Candlestick updates for subscribed symbols
    ```json
    {
      "type": "OHLCV_UPDATE",
      "symbol": "btcusdt",
      "timeframe": "1m",
      "data": {
        "time": 1647352800000,
        "open": 65000.00,
        "high": 65500.00,
        "low": 64800.00,
        "close": 65200.00,
        "volume": 123.45
      }
    }
    ```

    ### ORDER_UPDATE
    Updates for your orders (requires authentication)
    ```json
    {
      "type": "ORDER_UPDATE",
      "orderId": "123e4567-e89b-12d3-a456-426614174000",
      "status": "FILLED",
      "executedPrice": 65050,
      "timestamp": 1647352800000
    }
    ```

    ### BALANCE_UPDATE
    Updates for your account balance (requires authentication)
    ```json
    {
      "type": "BALANCE_UPDATE",
      "usdcBalance": 10000.00,
      "timestamp": 1647352800000
    }
    ```

# WebSocket Events Documentation
