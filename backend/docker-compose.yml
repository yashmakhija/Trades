version: "3.8"

services:
  # TimescaleDB with PostGIS extension
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading_app
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network

  # Trading app backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/trading_app?schema=public
      - PORT=3001
      - JWT_SECRET=super-secure-jwt-secret-for-development
      - JWT_EXPIRES_IN=7d
      - BINANCE_WEBSOCKET_URL=wss://stream.binance.com:9443/ws
      - TRADING_SYMBOLS=btcusdt,ethusdt,bnbusdt,solusdt,adausdt
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - trading-network

volumes:
  timescale_data:
    driver: local

networks:
  trading-network:
    driver: bridge
