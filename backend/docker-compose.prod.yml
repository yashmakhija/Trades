upversion: "3.8"

services:
  # TimescaleDB with PostGIS extension
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading_app
    volumes:
      - trading_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network
    command: >
      postgres -c shared_preload_libraries=timescaledb
              -c timescaledb.telemetry_level=off

  # Trading app backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/trading_app?schema=public
      - PORT=3001
      - JWT_SECRET=super-secure-jwt-secret-for-development
      - JWT_EXPIRES_IN=7d
      - BINANCE_WEBSOCKET_URL=wss://stream.binance.com:9443/ws
      - TRADING_SYMBOLS=btcusdt,ethusdt,bnbusdt,solusdt,adausdt
      - PRISMA_CLIENT_ENGINE_TYPE=binary
      - SEED_DATABASE=true
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  trading_db_data:
    name: trading_db_data
    external: true

networks:
  trading-network:
    name: trading-network
    driver: bridge
