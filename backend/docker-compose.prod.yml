version: "3.8"

services:
  # TimescaleDB with PostGIS extension
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading_app
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - trading-network
    command: >
      postgres -c shared_preload_libraries=timescaledb
              -c timescaledb.telemetry_level=off

  # Trading app backend
  backend:
    image: ${DOCKER_USERNAME}/trading-app-backend:latest
    container_name: trading-backend-2
    restart: unless-stopped
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/trading_app?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=tradingapp
      - REDIS_DB=0
    networks:
      - trading-network
    depends_on:
      - timescaledb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  timescale_data:
    driver: local

networks:
  trading-network:
    driver: bridge
