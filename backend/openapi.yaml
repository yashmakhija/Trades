openapi: 3.0.0
info:
  title: Trading App API
  description: API for the Trading Application with real-time market data
  version: 1.0.0
  contact:
    name: API Support
    email: support@tradingapp.com

servers:
  - url: http://localhost:3001
    description: Development server
  - url: ws://localhost:3001
    description: WebSocket server

tags:
  - name: Symbols
    description: Trading symbols operations
  - name: WebSocket
    description: Real-time data streaming

paths:
  /api/symbols:
    get:
      summary: Get all trading symbols
      description: Returns a list of all available trading symbols with their current prices
      tags:
        - Symbols
      responses:
        "200":
          description: A list of symbols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Symbol"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/symbols/prices:
    get:
      summary: Get latest prices for all symbols
      description: Returns the latest real-time prices for all trading symbols
      tags:
        - Symbols
      responses:
        "200":
          description: Latest prices for all symbols
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/TickerData"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/symbols/{name}:
    get:
      summary: Get a specific symbol by name
      description: Returns detailed information about a specific trading symbol
      tags:
        - Symbols
      parameters:
        - name: name
          in: path
          required: true
          description: Symbol name (e.g., btcusdt)
          schema:
            type: string
      responses:
        "200":
          description: Symbol details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolDetail"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api-docs:
    get:
      summary: API Documentation
      description: Swagger UI for API documentation
      responses:
        "200":
          description: HTML page with Swagger UI

components:
  schemas:
    Symbol:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "btcusdt"
        description:
          type: string
          example: "BTCUSDT trading pair"
        currentPrice:
          type: number
          format: float
          example: 65432.10
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SymbolDetail:
      type: object
      allOf:
        - $ref: "#/components/schemas/Symbol"
        - type: object
          properties:
            latestData:
              $ref: "#/components/schemas/TickerData"

    TickerData:
      type: object
      properties:
        symbol:
          type: string
          example: "btcusdt"
        price:
          type: number
          format: float
          example: 65432.10
        priceChangePercent:
          type: number
          format: float
          example: 2.5
        volume:
          type: number
          format: float
          example: 1234.56
        timestamp:
          type: integer
          format: int64
          example: 1647352800000

    OHLCV:
      type: object
      properties:
        id:
          type: string
          format: uuid
        symbol:
          type: string
          example: "btcusdt"
        open:
          type: number
          format: float
          example: 65000.00
        high:
          type: number
          format: float
          example: 65500.00
        low:
          type: number
          format: float
          example: 64800.00
        close:
          type: number
          format: float
          example: 65200.00
        volume:
          type: number
          format: float
          example: 123.45
        timestamp:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Failed to fetch symbols"

  # WebSocket documentation (not standard OpenAPI but useful for documentation)
  x-websocket-events:
    connection:
      description: Connect to the WebSocket server
      url: ws://localhost:3001

    messages:
      - name: INITIAL_DATA
        description: Initial data sent when client connects
        direction: server-to-client
        schema:
          type: object
          properties:
            type:
              type: string
              enum: [INITIAL_DATA]
            data:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/TickerData"

      - name: TICKER_UPDATE
        description: Real-time ticker updates
        direction: server-to-client
        schema:
          type: object
          properties:
            type:
              type: string
              enum: [TICKER_UPDATE]
            symbol:
              type: string
              example: "btcusdt"
            data:
              $ref: "#/components/schemas/TickerData"

      - name: OHLCV_UPDATE
        description: Real-time OHLCV (candlestick) updates
        direction: server-to-client
        schema:
          type: object
          properties:
            type:
              type: string
              enum: [OHLCV_UPDATE]
            symbol:
              type: string
              example: "btcusdt"
            data:
              $ref: "#/components/schemas/OHLCV"

      - name: SUBSCRIBE
        description: Subscribe to updates for a specific symbol
        direction: client-to-server
        schema:
          type: object
          properties:
            type:
              type: string
              enum: [SUBSCRIBE]
            symbol:
              type: string
              example: "btcusdt"
