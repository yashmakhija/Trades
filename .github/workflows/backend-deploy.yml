name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/trading-app-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/trading-app-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/trading-app-backend:buildcache,mode=max

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Debug variables and setup SSH known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          # Safely add host key without variables in the command
          echo "Setting up SSH known_hosts for $VPS_HOST:$VPS_PORT"
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_PORT" ]; then
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          else
            echo "Error: VPS_HOST or VPS_PORT is empty"
            exit 1
          fi

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production
          PORT: 3001
        run: |
          # Check if required variables are set
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USERNAME" ] || [ -z "$VPS_PORT" ] || [ -z "$DATABASE_URL" ]; then
            echo "Error: Required variables are not set"
            echo "VPS_HOST set: $([ -n "$VPS_HOST" ] && echo "Yes" || echo "No")"
            echo "VPS_USERNAME set: $([ -n "$VPS_USERNAME" ] && echo "Yes" || echo "No")"
            echo "VPS_PORT set: $([ -n "$VPS_PORT" ] && echo "Yes" || echo "No")"
            echo "DATABASE_URL set: $([ -n "$DATABASE_URL" ] && echo "Yes" || echo "No")"
            exit 1
          fi

          # Create deploy script with proper escaping for environment variables
          cat > deploy.sh << EOF
          #!/bin/bash
          set -e

          # Variables
          APP_NAME="trading-app-backend"
          DEPLOY_DIR="/yash-code/Trades"
          IMAGE_NAME="${{ secrets.DOCKER_HUB_USERNAME }}/$APP_NAME:latest"
          CONTAINER_NAME="trading-backend-2"
          DB_CONTAINER_NAME="timescaledb"
          NETWORK_NAME="trading-network"
          CONTAINER_PORT=3001

          # Database credentials
          DB_USER="postgres"
          DB_PASSWORD="postgres"
          DB_NAME="trading_app"

          # Set DATABASE_URL to point to the TimescaleDB container
          DATABASE_URL="postgresql://\${DB_USER}:\${DB_PASSWORD}@\${DB_CONTAINER_NAME}:5432/\${DB_NAME}?schema=public"
          JWT_SECRET="${JWT_SECRET}"
          NODE_ENV="${NODE_ENV}"

          # Create directory if it doesn't exist
          mkdir -p $DEPLOY_DIR

          # Create Docker network if not exists
          if ! docker network inspect $NETWORK_NAME >/dev/null 2>&1; then
            echo "Creating Docker network: $NETWORK_NAME"
            docker network create $NETWORK_NAME
          fi

          # Check if TimescaleDB container exists and is running
          if docker ps -a | grep -q $DB_CONTAINER_NAME; then
            echo "TimescaleDB container exists"
            if ! docker ps | grep -q $DB_CONTAINER_NAME; then
              echo "Starting existing TimescaleDB container"
              docker start $DB_CONTAINER_NAME
            else
              echo "TimescaleDB container is already running"
            fi
          else
            echo "Creating and starting TimescaleDB container"
            docker run -d \\
              --name $DB_CONTAINER_NAME \\
              --network $NETWORK_NAME \\
              -e POSTGRES_USER=$DB_USER \\
              -e POSTGRES_PASSWORD=$DB_PASSWORD \\
              -e POSTGRES_DB=$DB_NAME \\
              -v timescale_data:/var/lib/postgresql/data \\
              --restart unless-stopped \\
              timescale/timescaledb:latest-pg14
              
            # Wait for database to be ready
            echo "Waiting for database to be ready..."
            sleep 15
          fi

          # Stop and remove existing backend container if it exists
          if docker ps -a | grep -q $CONTAINER_NAME; then
            echo "Stopping and removing existing backend container"
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
          fi

          # Create env file with explicit values
          cat > $DEPLOY_DIR/.env << EOFENV
          DATABASE_URL=${DATABASE_URL}
          JWT_SECRET=${JWT_SECRET}
          NODE_ENV=${NODE_ENV}
          PORT=${CONTAINER_PORT}
          EOFENV

          # Pull latest image
          echo "Pulling latest backend image"
          docker pull $IMAGE_NAME

          # Debug env file
          echo "Created .env file with contents:"
          cat $DEPLOY_DIR/.env

          # Run new container with explicit environment variables
          echo "Starting backend container"
          docker run -d \\
            --name $CONTAINER_NAME \\
            --network $NETWORK_NAME \\
            -p $CONTAINER_PORT:$CONTAINER_PORT \\
            --restart unless-stopped \\
            -e DATABASE_URL="\${DATABASE_URL}" \\
            -e JWT_SECRET="\${JWT_SECRET}" \\
            -e NODE_ENV="\${NODE_ENV}" \\
            -e PORT="\${CONTAINER_PORT}" \\
            $IMAGE_NAME

          # Verify containers are running
          echo "Verifying containers are running:"
          docker ps | grep -E "$CONTAINER_NAME|$DB_CONTAINER_NAME"

          echo "Deployment complete!"
          EOF

          echo "Debug: deploy.sh file created"
          chmod +x deploy.sh

          echo "Debug: Attempting to transfer script to VPS"
          scp -P "$VPS_PORT" deploy.sh "$VPS_USERNAME@$VPS_HOST:/tmp/deploy.sh"

          echo "Debug: Script transferred. Attempting to execute on VPS..."
          ssh -p "$VPS_PORT" "$VPS_USERNAME@$VPS_HOST" "bash /tmp/deploy.sh && rm /tmp/deploy.sh"
