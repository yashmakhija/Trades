name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/trading-app-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/trading-app-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/trading-app-backend:buildcache,mode=max

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production
          PORT: 3001
          DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          ssh-keyscan -p $VPS_PORT $VPS_HOST >> ~/.ssh/known_hosts

          # Direct deployment command
          ssh -p $VPS_PORT $VPS_USERNAME@$VPS_HOST << EOF
            # Create deployment directory
            mkdir -p /yash-code/Trades
            
            # Setup Docker network
            docker network create trading-network 2>/dev/null || true
            
            # Setup database container
            if ! docker ps | grep -q timescaledb; then
              if docker ps -a | grep -q timescaledb; then
                docker start timescaledb
              else
                docker run -d --name timescaledb --network trading-network \\
                  -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=trading_app \\
                  -v timescale_data:/var/lib/postgresql/data --restart unless-stopped \\
                  timescale/timescaledb:latest-pg14
                sleep 10
              fi
            fi
            
            # Stop and remove existing backend container
            docker stop trading-backend-2 2>/dev/null || true
            docker rm trading-backend-2 2>/dev/null || true
            
            # Create env file
            cat > /yash-code/Trades/.env << EOFENV
            DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/trading_app?schema=public
            JWT_SECRET=$JWT_SECRET
            NODE_ENV=production
            PORT=3001
            EOFENV
            
            # Pull and run new container
            docker pull $DOCKER_USERNAME/trading-app-backend:latest
            
            docker run -d --name trading-backend-2 --network trading-network \\
              -p 3001:3001 --restart unless-stopped \\
              -e DATABASE_URL="postgresql://postgres:postgres@timescaledb:5432/trading_app?schema=public" \\
              -e JWT_SECRET="$JWT_SECRET" \\
              -e NODE_ENV="production" \\
              -e PORT="3001" \\
              $DOCKER_USERNAME/trading-app-backend:latest
            
            # Verify deployment
            docker ps | grep -E "trading-backend-2|timescaledb"
            echo "Deployment complete!"
          EOF
