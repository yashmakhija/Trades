name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/trading-app-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/trading-app-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/trading-app-backend:buildcache,mode=max

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production
          PORT: 3001
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p $VPS_PORT $VPS_HOST >> ~/.ssh/known_hosts

          # Create deploy script
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e

          # Variables
          APP_NAME="trading-app-backend"
          DEPLOY_DIR="/yash-code/Trades"
          IMAGE_NAME="${{ secrets.DOCKER_HUB_USERNAME }}/$APP_NAME:latest"
          CONTAINER_NAME="trading-backend-2"
          NETWORK_NAME="trading-network"
          CONTAINER_PORT=3001

          # Create directory if it doesn't exist
          mkdir -p $DEPLOY_DIR

          # Create Docker network if not exists
          if ! docker network inspect $NETWORK_NAME >/dev/null 2>&1; then
            docker network create $NETWORK_NAME
          fi

          # Stop and remove existing container if it exists
          if docker ps -a | grep -q $CONTAINER_NAME; then
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
          fi

          # Create env file
          cat > $DEPLOY_DIR/.env << EOFENV
          DATABASE_URL=$DATABASE_URL
          JWT_SECRET=$JWT_SECRET
          NODE_ENV=$NODE_ENV
          PORT=$CONTAINER_PORT
          EOFENV

          # Pull latest image
          docker pull $IMAGE_NAME

          # Run new container
          docker run -d \
            --name $CONTAINER_NAME \
            --network $NETWORK_NAME \
            -p $CONTAINER_PORT:$CONTAINER_PORT \
            --restart unless-stopped \
            --env-file $DEPLOY_DIR/.env \
            $IMAGE_NAME

          # Verify container is running
          docker ps | grep $CONTAINER_NAME

          echo "Deployment complete!"
          EOF

          # Make script executable and transfer to VPS
          chmod +x deploy.sh
          scp -P $VPS_PORT deploy.sh $VPS_USERNAME@$VPS_HOST:/tmp/deploy.sh

          # Execute deployment script on VPS
          ssh -p $VPS_PORT $VPS_USERNAME@$VPS_HOST "bash /tmp/deploy.sh && rm /tmp/deploy.sh"
