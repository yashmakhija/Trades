name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/trading-app-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/trading-app-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/trading-app-backend:buildcache,mode=max

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          ssh-keyscan -p $VPS_PORT $VPS_HOST >> ~/.ssh/known_hosts

          # Create TimescaleDB initialization script
          cat > init-timescaledb.sql << EOF
          -- Create TimescaleDB extension
          CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;

          -- After Prisma has created the tables, convert OHLCV to a hypertable
          SELECT create_hypertable('"OHLCV"', 'time', if_not_exists => TRUE, migrate_data => TRUE);

          -- Create appropriate indexes for TimescaleDB to work efficiently
          CREATE INDEX IF NOT EXISTS "idx_ohlcv_symbol_time" ON "OHLCV" ("symbolId", "time" DESC);
          CREATE INDEX IF NOT EXISTS "idx_ohlcv_timeframe_time" ON "OHLCV" ("timeframe", "time" DESC);
          CREATE INDEX IF NOT EXISTS "idx_ohlcv_time" ON "OHLCV" ("time" DESC);

          -- Configure optimized chunk sizes based on timeframe
          -- For 1-minute data, we use 1-day chunks (1440 records per chunk)
          SELECT set_chunk_time_interval('"OHLCV"', INTERVAL '1 day');

          -- Add compression policy to automatically compress older data
          -- This dramatically reduces storage requirements while maintaining query performance
          SELECT add_compression_policy('"OHLCV"', INTERVAL '7 days');

          -- Configure compression settings to optimize compression ratio
          ALTER TABLE "OHLCV" SET (
            timescaledb.compress,
            timescaledb.compress_segmentby = '"symbolId", "timeframe"',
            timescaledb.compress_orderby = 'time DESC'
          );

          -- Create continuous aggregates for common timeframes
          -- These automatically pre-compute aggregated views to dramatically speed up queries
          -- 5-minute continuous aggregate
          CREATE MATERIALIZED VIEW continuous_aggregate_5m
          WITH (timescaledb.continuous) AS
          SELECT
            time_bucket('5 minutes', time) AS bucket,
            "symbolId",
            first(open, time) AS open,
            max(high) AS high,
            min(low) AS low,
            last(close, time) AS close,
            sum(volume) AS volume
          FROM "OHLCV"
          WHERE timeframe = 'ONE_MINUTE'
          GROUP BY bucket, "symbolId"
          WITH NO DATA;

          -- 15-minute continuous aggregate
          CREATE MATERIALIZED VIEW continuous_aggregate_15m
          WITH (timescaledb.continuous) AS
          SELECT
            time_bucket('15 minutes', time) AS bucket,
            "symbolId",
            first(open, time) AS open,
            max(high) AS high,
            min(low) AS low,
            last(close, time) AS close,
            sum(volume) AS volume
          FROM "OHLCV"
          WHERE timeframe = 'ONE_MINUTE'
          GROUP BY bucket, "symbolId"
          WITH NO DATA;

          -- 1-hour continuous aggregate
          CREATE MATERIALIZED VIEW continuous_aggregate_1h
          WITH (timescaledb.continuous) AS
          SELECT
            time_bucket('1 hour', time) AS bucket,
            "symbolId",
            first(open, time) AS open,
            max(high) AS high,
            min(low) AS low,
            last(close, time) AS close,
            sum(volume) AS volume
          FROM "OHLCV"
          WHERE timeframe = 'ONE_MINUTE'
          GROUP BY bucket, "symbolId"
          WITH NO DATA;

          -- 1-day continuous aggregate
          CREATE MATERIALIZED VIEW continuous_aggregate_1d
          WITH (timescaledb.continuous) AS
          SELECT
            time_bucket('1 day', time) AS bucket,
            "symbolId",
            first(open, time) AS open,
            max(high) AS high,
            min(low) AS low,
            last(close, time) AS close,
            sum(volume) AS volume
          FROM "OHLCV"
          WHERE timeframe = 'ONE_MINUTE'
          GROUP BY bucket, "symbolId"
          WITH NO DATA;

          -- Create refresh policies for continuous aggregates
          SELECT add_continuous_aggregate_policy('continuous_aggregate_5m',
            start_offset => INTERVAL '1 month',
            end_offset => INTERVAL '5 minutes',
            schedule_interval => INTERVAL '5 minutes');

          SELECT add_continuous_aggregate_policy('continuous_aggregate_15m',
            start_offset => INTERVAL '3 months',
            end_offset => INTERVAL '15 minutes',
            schedule_interval => INTERVAL '15 minutes');

          SELECT add_continuous_aggregate_policy('continuous_aggregate_1h',
            start_offset => INTERVAL '6 months',
            end_offset => INTERVAL '1 hour',
            schedule_interval => INTERVAL '1 hour');

          SELECT add_continuous_aggregate_policy('continuous_aggregate_1d',
            start_offset => INTERVAL '5 years',
            end_offset => INTERVAL '1 day',
            schedule_interval => INTERVAL '1 day');

          -- Create indexes on continuous aggregates for faster queries
          CREATE INDEX IF NOT EXISTS "idx_5m_symbol_bucket" 
          ON continuous_aggregate_5m ("symbolId", bucket DESC);

          CREATE INDEX IF NOT EXISTS "idx_15m_symbol_bucket" 
          ON continuous_aggregate_15m ("symbolId", bucket DESC);

          CREATE INDEX IF NOT EXISTS "idx_1h_symbol_bucket" 
          ON continuous_aggregate_1h ("symbolId", bucket DESC);

          CREATE INDEX IF NOT EXISTS "idx_1d_symbol_bucket" 
          ON continuous_aggregate_1d ("symbolId", bucket DESC);

          -- Create a function to handle candle aggregation using continuous aggregates
          CREATE OR REPLACE FUNCTION get_aggregate_candles(
            symbol_id TEXT,
            timeframe TEXT,
            start_time TIMESTAMPTZ,
            end_time TIMESTAMPTZ
          ) RETURNS TABLE (
            time TIMESTAMPTZ,
            open BIGINT,
            high BIGINT,
            low BIGINT,
            close BIGINT,
            volume BIGINT
          ) AS $$
          BEGIN
            CASE timeframe
              WHEN '5m' THEN
                RETURN QUERY
                SELECT 
                  bucket as time, 
                  open::BIGINT, 
                  high::BIGINT, 
                  low::BIGINT, 
                  close::BIGINT, 
                  volume::BIGINT
                FROM continuous_aggregate_5m
                WHERE "symbolId" = symbol_id
                  AND bucket BETWEEN start_time AND end_time
                ORDER BY bucket ASC;
              
              WHEN '15m' THEN
                RETURN QUERY
                SELECT 
                  bucket as time, 
                  open::BIGINT, 
                  high::BIGINT, 
                  low::BIGINT, 
                  close::BIGINT, 
                  volume::BIGINT
                FROM continuous_aggregate_15m
                WHERE "symbolId" = symbol_id
                  AND bucket BETWEEN start_time AND end_time
                ORDER BY bucket ASC;
              
              WHEN '1h' THEN
                RETURN QUERY
                SELECT 
                  bucket as time, 
                  open::BIGINT, 
                  high::BIGINT, 
                  low::BIGINT, 
                  close::BIGINT, 
                  volume::BIGINT
                FROM continuous_aggregate_1h
                WHERE "symbolId" = symbol_id
                  AND bucket BETWEEN start_time AND end_time
                ORDER BY bucket ASC;
              
              WHEN '1d' THEN
                RETURN QUERY
                SELECT 
                  bucket as time, 
                  open::BIGINT, 
                  high::BIGINT, 
                  low::BIGINT, 
                  close::BIGINT, 
                  volume::BIGINT
                FROM continuous_aggregate_1d
                WHERE "symbolId" = symbol_id
                  AND bucket BETWEEN start_time AND end_time
                ORDER BY bucket ASC;
              
              ELSE
                RETURN QUERY
                SELECT o.time, o.open, o.high, o.low, o.close, o.volume
                FROM "OHLCV" o
                WHERE o."symbolId" = symbol_id
                  AND o.timeframe = timeframe
                  AND o.time BETWEEN start_time AND end_time
                ORDER BY o.time ASC;
            END CASE;
          END;
          $$ LANGUAGE plpgsql;
          EOF

          # Create deployment script
          cat > deploy_script.sh << EOF
          #!/bin/bash
          set -e

          # Function to check if PostgreSQL is ready
          check_postgres() {
            sudo docker exec timescaledb pg_isready -U postgres || return 1
            return 0
          }

          # Function to check if Redis is ready
          check_redis() {
            redis-cli -h 127.0.0.1 ping || return 1
            return 0
          }

          # Get host IP address
          HOST_IP=\$(ip route get 1 | awk '{print \$7;exit}')

          # Create deployment directory
          sudo mkdir -p /yash-code/Trades

          # Setup Redis
          echo "Setting up Redis..."
          if ! command -v redis-server &> /dev/null; then
            echo "Installing Redis..."
            sudo apt-get update
            sudo apt-get install -y redis-server

            # Configure Redis
            echo "Configuring Redis..."
            sudo sed -i 's/supervised no/supervised systemd/' /etc/redis/redis.conf
            sudo sed -i 's/# maxmemory <bytes>/maxmemory 512mb/' /etc/redis/redis.conf
            sudo sed -i 's/# maxmemory-policy noeviction/maxmemory-policy allkeys-lru/' /etc/redis/redis.conf
            sudo sed -i 's/protected-mode yes/protected-mode no/' /etc/redis/redis.conf
            sudo sed -i 's/bind 127.0.0.1/bind 0.0.0.0/' /etc/redis/redis.conf
            sudo sed -i 's/# requirepass foobared/requirepass tradingapp/' /etc/redis/redis.conf

            # Configure firewall
            echo "Configuring firewall..."
            sudo ufw allow 6379/tcp

            # Start Redis service
            echo "Starting Redis service..."
            sudo systemctl enable redis-server
            sudo systemctl restart redis-server
          else
            # Update existing Redis configuration
            echo "Updating Redis configuration..."
            sudo sed -i 's/protected-mode yes/protected-mode no/' /etc/redis/redis.conf
            sudo sed -i 's/bind 127.0.0.1/bind 0.0.0.0/' /etc/redis/redis.conf
            sudo sed -i 's/# requirepass foobared/requirepass tradingapp/' /etc/redis/redis.conf
            sudo systemctl restart redis-server
          fi

          # Wait for Redis to be ready
          echo "Waiting for Redis to be ready..."
          TIMEOUT=30
          COUNTER=0
          until check_redis || [ \$COUNTER -eq \$TIMEOUT ]; do
            echo "Waiting for Redis to become ready... (\$COUNTER/\$TIMEOUT)"
            sleep 1
            COUNTER=\$((COUNTER+1))
          done

          if [ \$COUNTER -eq \$TIMEOUT ]; then
            echo "Error: Redis did not become ready within \$TIMEOUT seconds"
            sudo systemctl status redis-server
            exit 1
          fi

          echo "Redis is now ready!"

          # Test Redis connection from host
          echo "Testing Redis connection..."
          redis-cli -h 127.0.0.1 -a tradingapp ping || {
            echo "Failed to connect to Redis on host"
            exit 1
          }

          # Setup Docker network
          echo "Setting up Docker network..."
          sudo docker network create trading-network 2>/dev/null || true

          # Remove existing containers to ensure clean deployment
          echo "Removing existing containers if they exist..."
          sudo docker stop trading-backend-2 2>/dev/null || true
          sudo docker rm trading-backend-2 2>/dev/null || true
          sudo docker stop timescaledb 2>/dev/null || true
          sudo docker rm timescaledb 2>/dev/null || true

          # Setup database container
          echo "Starting TimescaleDB container..."
          sudo docker run -d \\
            --name timescaledb \\
            --network trading-network \\
            -p 5432:5432 \\
            -e POSTGRES_USER=postgres \\
            -e POSTGRES_PASSWORD=postgres \\
            -e POSTGRES_DB=trading_app \\
            -v timescale_data:/var/lib/postgresql/data \\
            --restart unless-stopped \\
            timescale/timescaledb:latest-pg14

          # Wait for database to be ready
          echo "Waiting for database to be ready..."
          TIMEOUT=60
          COUNTER=0
          until check_postgres || [ \$COUNTER -eq \$TIMEOUT ]; do
            echo "Waiting for PostgreSQL to become ready... (\$COUNTER/\$TIMEOUT)"
            sleep 3
            COUNTER=\$((COUNTER+1))
          done

          if [ \$COUNTER -eq \$TIMEOUT ]; then
            echo "Error: PostgreSQL did not become ready within \$TIMEOUT seconds"
            sudo docker logs timescaledb
            exit 1
          fi

          echo "PostgreSQL is now ready!"

          # Create the trading_app database if it doesn't exist
          echo "Ensuring database exists..."
          sudo docker exec timescaledb psql -U postgres -c "CREATE DATABASE trading_app;" 2>/dev/null || echo "Database already exists"

          # Create env file
          echo "Creating environment file..."
          sudo bash -c "cat > /yash-code/Trades/.env << EOF
          DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/trading_app?schema=public
          JWT_SECRET=${JWT_SECRET}
          NODE_ENV=production
          PORT=3001
          REDIS_HOST=host.docker.internal
          REDIS_PORT=6379
          REDIS_PASSWORD=tradingapp
          REDIS_DB=0
          EOF"

          # Pull and run backend container
          echo "Pulling latest image..."
          sudo docker pull ${DOCKER_USERNAME}/trading-app-backend:latest

          echo "Starting backend container..."
          sudo docker run -d \\
            --name trading-backend-2 \\
            --network trading-network \\
            -p 3001:3001 \\
            --add-host=host.docker.internal:host-gateway \\
            --restart unless-stopped \\
            -e DATABASE_URL="postgresql://postgres:postgres@timescaledb:5432/trading_app?schema=public" \\
            -e JWT_SECRET="${JWT_SECRET}" \\
            -e NODE_ENV="production" \\
            -e PORT="3001" \\
            -e REDIS_HOST="host.docker.internal" \\
            -e REDIS_PORT="6379" \\
            -e REDIS_PASSWORD="tradingapp" \\
            -e REDIS_DB="0" \\
            ${DOCKER_USERNAME}/trading-app-backend:latest

          # Run initial database migrations and setup
          echo "Running database migrations..."
          sudo docker exec trading-backend-2 bun db:generate
          sudo docker exec trading-backend-2 bun db:push

          # Apply TimescaleDB initialization script
          echo "Initializing TimescaleDB with advanced features..."
          sudo docker cp /tmp/init-timescaledb.sql timescaledb:/tmp/init-timescaledb.sql
          sudo docker exec timescaledb psql -U postgres -d trading_app -f /tmp/init-timescaledb.sql || {
            echo "Failed to initialize TimescaleDB features"
            sudo docker logs timescaledb
            # Don't exit here, as it's not critical for basic functionality
          }

          # Initialize sample data
          echo "Initializing sample data..."
          sudo docker exec trading-backend-2 bun db:init || {
            echo "Sample data initialization failed, but continuing..."
          }

          # Verify deployment
          echo "Verifying containers are running:"
          sudo docker ps

          # Test Redis connection from container
          echo "Testing Redis connection from container..."
          sudo docker exec trading-backend-2 redis-cli -h host.docker.internal -a tradingapp ping || {
            echo "Failed to connect to Redis from container"
            sudo docker logs trading-backend-2
            exit 1
          }

          # Check the logs of the backend to ensure it's working properly
          echo "Checking backend logs:"
          sleep 5
          sudo docker logs trading-backend-2

          echo "Deployment complete!"
          EOF

          # Transfer files to VPS
          echo "Transferring files to VPS..."
          scp -P $VPS_PORT deploy_script.sh $VPS_USERNAME@$VPS_HOST:/tmp/deploy_script.sh
          scp -P $VPS_PORT init-timescaledb.sql $VPS_USERNAME@$VPS_HOST:/tmp/init-timescaledb.sql

          # Execute script on VPS
          echo "Executing deployment script on VPS..."
          ssh -p $VPS_PORT $VPS_USERNAME@$VPS_HOST "chmod +x /tmp/deploy_script.sh && sudo /tmp/deploy_script.sh && rm /tmp/deploy_script.sh"
